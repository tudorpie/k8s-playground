apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: k8s-playground

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - cloudflared-configmap.yaml
  - cloudflared-deployment.yaml

# Use the modern `labels` field with includeSelectors=false. The legacy
# `commonLabels` would inject this label into every label-selector — including
# the `to:` selectors inside NetworkPolicies, which would then fail to match
# kube-dns / ingress-nginx (those pods do not carry this label).
labels:
  - pairs:
      app.kubernetes.io/part-of: k8s-playground
    includeSelectors: false
    includeTemplates: false
